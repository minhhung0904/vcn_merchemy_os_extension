<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sellfern – Etsy connection</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           font-family: system-ui, sans-serif; background: #f5f6f8; color: #1f2430; }
    .card { max-width: 420px; padding: 32px; background: #fff; border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,.08); text-align: center; }
    .icon { font-size: 40px; margin-bottom: 8px; }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p { margin: 0 0 4px; color: #4b5262; font-size: 14px; line-height: 1.5; }
    @media (prefers-color-scheme: dark) {
      body { background: #14161c; color: #e8eaf0; }
      .card { background: #1d2029; }
      p { color: #a9afbf; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon" id="icon"></div>
    <h1 id="title"></h1>
    <p id="message"></p>
    <p>You can close this tab.</p>
  </div>
  <script src="result.js"></script>
</body>
</html>
